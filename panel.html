<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ShinPo Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#141b3d;--ink2:#232d63;--ink3:#2d3978;--chalk:#f4f5fa;--saf:#ffc233;--mut:#9aa3cf;--ok:#35d07f;--bad:#ff6b5e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;touch-action:manipulation;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:#fff;font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
button,input{font:inherit;color:inherit}
input{font-size:16px}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--saf);outline-offset:2px}

.word{display:inline-flex;align-items:center;font-weight:800;font-size:22px;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.word .lt{display:inline-block;animation:letterin .7s calc(var(--i)*.06s) cubic-bezier(.2,.9,.3,1.3) backwards,wave 3.2s calc(1.4s + var(--i)*.12s) ease-in-out infinite}
.word .lt.sp{width:.3em}
.word .lt.hl{color:var(--saf)}
@keyframes letterin{from{opacity:0;transform:translateY(.6em) rotate(8deg) scale(.6)}}
@keyframes wave{0%,60%,100%{transform:none}30%{transform:translateY(-.14em)}}
.word .logo{width:1.25em;height:1.25em;flex:none;margin-right:.3em;animation:logoin .8s cubic-bezier(.2,.9,.3,1.3) backwards,float 4s 1s ease-in-out infinite}
@keyframes logoin{from{opacity:0;transform:scale(.3) rotate(-25deg)}}
@keyframes float{0%,100%{transform:none}50%{transform:translateY(-.1em) rotate(-4deg)}}
.logo .bub{fill:var(--saf)}
.logo .dt{fill:var(--ink);transform-box:fill-box;transform-origin:center;animation:dot 1.2s ease-in-out infinite}
.logo .dt:nth-of-type(2){animation-delay:.15s}
.logo .dt:nth-of-type(3){animation-delay:.3s}
@keyframes dot{0%,60%,100%{transform:none;opacity:.55}30%{transform:translateY(-3px);opacity:1}}
.word i{display:inline-block;width:.2em;height:.2em;border-radius:50%;background:var(--saf);margin-left:.1em;animation:letterin .6s 1s backwards,ping2 1.8s 1.6s infinite}
@keyframes ping2{0%{box-shadow:0 0 0 0 rgba(255,194,51,.7)}100%{box-shadow:0 0 0 .45em rgba(255,194,51,0)}}

header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(20,27,61,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--ink2);overflow:hidden}
header:after{content:"";position:absolute;top:0;bottom:0;width:40%;left:-50%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.08),transparent);animation:sheen 5s 2s infinite;pointer-events:none}
@keyframes sheen{0%{left:-50%}40%,100%{left:130%}}
.chip{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:20px;background:var(--saf);color:var(--ink)}
.sp{flex:1}
.ghost{background:transparent;border:1.5px solid #3a4580;border-radius:10px;padding:8px 14px;font-weight:600;transition:background .2s,border-color .2s}
.ghost:hover{background:var(--ink2);border-color:var(--saf)}

main{max-width:960px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.card{background:var(--ink2);border-radius:16px;padding:16px;opacity:0;transform:translateY(14px);animation:rise .6s var(--d,0s) cubic-bezier(.2,.9,.3,1.1) forwards}
@keyframes rise{to{opacity:1;transform:none}}
.card b{display:block;font-size:34px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.card span{color:var(--mut);font-size:13px}
.card.live b{color:var(--ok)}
.card.live span:before{content:"";display:inline-block;width:8px;height:8px;margin-right:6px;border-radius:50%;background:var(--ok);animation:ping 1.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(53,208,127,.7)}100%{box-shadow:0 0 0 10px rgba(53,208,127,0)}}

.bar{display:flex;gap:10px;align-items:center;margin:22px 0 12px}
.bar h2{margin:0;font-size:18px}
.bar .sp{flex:1}
.search{width:min(260px,100%);padding:10px 14px;border-radius:12px;border:1.5px solid #3a4580;background:var(--ink2);outline:none;transition:border-color .2s}
.search:focus{border-color:var(--saf)}
.search::placeholder{color:var(--mut)}

#list{display:flex;flex-direction:column;gap:10px}
.u{display:flex;align-items:center;gap:12px;background:var(--ink2);border-radius:16px;padding:12px 14px;opacity:0;transform:translateX(-16px);animation:slidein .45s var(--d,0s) cubic-bezier(.2,.9,.3,1.1) forwards;transition:background .2s}
.u:hover{background:var(--ink3)}
@keyframes slidein{to{opacity:1;transform:none}}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;background:var(--saf);color:var(--ink)}
.u.ban .av{background:#555c85;color:#fff}
.info{flex:1;min-width:0}
.nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em,.meta{color:var(--mut);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;margin-top:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px;background:#3a4580}
.tag.on{background:rgba(53,208,127,.2);color:var(--ok)}
.tag.off{background:rgba(255,107,94,.2);color:var(--bad)}
.acts{display:flex;gap:8px;flex:none}
.btn{border:0;border-radius:10px;padding:8px 12px;font-weight:700;font-size:13px;background:#3a4580;transition:transform .15s,background .2s}
.btn:hover{transform:translateY(-1px);background:#4a58a0}
.btn.del{background:rgba(255,107,94,.18);color:var(--bad)}
.btn.del:hover{background:rgba(255,107,94,.32)}
.btn:disabled{opacity:.5;pointer-events:none}
.empty{text-align:center;color:var(--mut);padding:40px 0}

.modal{position:fixed;inset:0;z-index:20;background:rgba(8,11,30,.7);display:flex;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.box{background:var(--ink2);border-radius:18px;padding:22px;max-width:360px;width:100%;animation:pop .3s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.box h3{margin:0 0 8px}
.box p{margin:0 0 18px;color:var(--mut);line-height:1.45;overflow-wrap:anywhere}
.box .row{display:flex;gap:10px;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,30px);background:var(--saf);color:var(--ink);font-weight:700;padding:10px 18px;border-radius:24px;opacity:0;transition:.3s;z-index:30}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:560px){.u{flex-wrap:wrap}.acts{width:100%;justify-content:flex-end}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header>
  <div class="word" data-brand></div>
  <span class="chip">Owner</span>
  <span class="sp"></span>
  <button id="out" class="ghost" type="button">Keluar</button>
</header>
<main>
  <section class="stats" id="stats"></section>
  <div class="bar">
    <h2>Pengguna</h2>
    <span class="sp"></span>
    <input id="q" class="search" type="search" placeholder="Cari nama atau email" autocomplete="off">
  </div>
  <div id="list"></div>
</main>
<div id="toast" class="toast"></div>

<script>
(function () {
  var NAME = 'ShinPo Chat';
  var LOGO = '<svg class="logo" viewBox="0 0 40 40" aria-hidden="true"><path class="bub" d="M20 3C10.6 3 3 9.9 3 18.5c0 4.7 2.3 8.9 5.9 11.7L7.5 36.5c-.2.8.6 1.4 1.3 1l6.2-3.5c1.6.4 3.3.6 5 .6 9.4 0 17-6.9 17-15.5S29.4 3 20 3z"/><circle class="dt" cx="12.5" cy="18.5" r="2.4"/><circle class="dt" cx="20" cy="18.5" r="2.4"/><circle class="dt" cx="27.5" cy="18.5" r="2.4"/></svg>';
  document.querySelectorAll('[data-brand]').forEach(function (el) {
    var h = LOGO;
    for (var i = 0; i < NAME.length; i++) {
      var c = NAME.charAt(i);
      if (c === ' ') h += '<span class="lt sp" style="--i:' + i + '"></span>';
      else h += '<span class="lt' + (i === 4 ? ' hl' : '') + '" style="--i:' + i + '">' + c + '</span>';
    }
    el.setAttribute('aria-label', NAME);
    el.innerHTML = h + '<i></i>';
  });

  // Cegah zoom
  var opt = { passive: false };
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) { document.addEventListener(t, function (e) { e.preventDefault(); }, opt); });
  document.addEventListener('touchmove', function (e) { if (e.touches && e.touches.length > 1) e.preventDefault(); }, opt);
  window.addEventListener('wheel', function (e) { if (e.ctrlKey) e.preventDefault(); }, opt);

  var $ = function (s) { return document.querySelector(s); };
  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

  function api(path, body) {
    var o = body ? { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) } : {};
    return fetch(path, o).then(function (r) {
      if (r.status === 404) { location.replace('/'); throw new Error('sesi'); }
      return r.json().then(function (d) { if (!r.ok) throw new Error(d.error || 'Gagal'); return d; });
    });
  }

  var toastT;
  function toast(t) {
    var e = $('#toast'); e.textContent = t; e.classList.add('show');
    clearTimeout(toastT); toastT = setTimeout(function () { e.classList.remove('show'); }, 2200);
  }

  // ----- Statistik -----
  var LABELS = [['users', 'Total pengguna'], ['online', 'Sedang online'], ['messages', 'Total pesan'], ['today', 'Pesan hari ini'], ['calls', 'Riwayat panggilan'], ['banned', 'Diblokir']];
  var shown = {};
  function countUp(node, to, key) {
    var from = shown[key] || 0, t0 = performance.now(), dur = 700;
    shown[key] = to;
    (function step(t) {
      var p = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - p, 3);
      node.textContent = Math.round(from + (to - from) * e).toLocaleString('id-ID');
      if (p < 1) requestAnimationFrame(step);
    })(t0);
  }
  function renderStats(d) {
    var box = $('#stats');
    if (!box.children.length) {
      LABELS.forEach(function (l, i) {
        var c = el('div', 'card' + (l[0] === 'online' ? ' live' : ''));
        c.style.setProperty('--d', (i * 0.07) + 's');
        c.appendChild(el('b', null, '0')); c.appendChild(el('span', null, l[1]));
        c.dataset.k = l[0];
        box.appendChild(c);
      });
    }
    box.querySelectorAll('.card').forEach(function (c) { countUp(c.firstChild, d[c.dataset.k] || 0, c.dataset.k); });
  }

  // ----- Pengguna -----
  function fmtDate(ts) { return ts ? new Date(ts).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : 'tanggal tidak tercatat'; }
  var lastSig = '';
  function renderUsers(list) {
    var sig = JSON.stringify(list);
    if (sig === lastSig) return;
    var first = !lastSig; lastSig = sig;
    var box = $('#list'); box.replaceChildren();
    if (!list.length) { box.appendChild(el('div', 'empty', 'Tidak ada pengguna ditemukan.')); return; }
    list.forEach(function (u, i) {
      var row = el('div', 'u' + (u.banned ? ' ban' : ''));
      row.style.setProperty('--d', first ? Math.min(i, 12) * 0.04 + 's' : '0s');
      row.appendChild(el('div', 'av', (u.name || u.email).charAt(0).toUpperCase()));
      var info = el('div', 'info');
      info.appendChild(el('div', 'nm', u.name || '-'));
      info.appendChild(el('div', 'em', u.email));
      info.appendChild(el('div', 'meta', 'Bergabung ' + fmtDate(u.created) + ' · ' + u.sent + ' pesan terkirim'));
      var tags = el('div', 'tags');
      if (u.online) tags.appendChild(el('span', 'tag on', 'Online'));
      if (u.banned) tags.appendChild(el('span', 'tag off', 'Diblokir'));
      if (tags.children.length) info.appendChild(tags);
      row.appendChild(info);
      var acts = el('div', 'acts');
      var b1 = el('button', 'btn', u.banned ? 'Buka blokir' : 'Blokir'); b1.type = 'button';
      b1.onclick = function () {
        b1.disabled = true;
        api('/api/adm/ban', { email: u.email, banned: !u.banned }).then(function () { toast(u.banned ? 'Blokir dibuka' : 'Pengguna diblokir'); refresh(); }).catch(function (e) { toast(e.message); b1.disabled = false; });
      };
      var b2 = el('button', 'btn del', 'Hapus'); b2.type = 'button';
      b2.onclick = function () { confirmDel(u); };
      acts.appendChild(b1); acts.appendChild(b2); row.appendChild(acts);
      box.appendChild(row);
    });
  }

  function confirmDel(u) {
    var m = el('div', 'modal'), b = el('div', 'box');
    b.appendChild(el('h3', null, 'Hapus pengguna?'));
    b.appendChild(el('p', null, (u.name || u.email) + ' (' + u.email + ') beserta semua pesan dan riwayat panggilannya akan dihapus permanen.'));
    var row = el('div', 'row');
    var no = el('button', 'btn', 'Batal'), yes = el('button', 'btn del', 'Hapus'); no.type = yes.type = 'button';
    no.onclick = function () { m.remove(); };
    m.onclick = function (e) { if (e.target === m) m.remove(); };
    yes.onclick = function () {
      yes.disabled = true;
      api('/api/adm/delete', { email: u.email }).then(function () { m.remove(); toast('Pengguna dihapus'); refresh(); }).catch(function (e) { toast(e.message); yes.disabled = false; });
    };
    row.appendChild(no); row.appendChild(yes); b.appendChild(row); m.appendChild(b); document.body.appendChild(m);
  }

  var busy = false;
  function refresh() {
    if (busy) return; busy = true;
    var q = encodeURIComponent($('#q').value.trim());
    Promise.all([api('/api/adm/stats'), api('/api/adm/users?q=' + q)])
      .then(function (r) { renderStats(r[0]); renderUsers(r[1]); })
      .catch(function () {})
      .then(function () { busy = false; });
  }
  var st;
  $('#q').addEventListener('input', function () { clearTimeout(st); st = setTimeout(function () { lastSig = ''; refresh(); }, 250); });
  $('#out').onclick = function () { api('/api/adm/logout', {}).catch(function () {}).then(function () { location.replace('/'); }); };
  refresh();
  setInterval(function () { if (!document.hidden) refresh(); }, 8000);
})();
</script>
</body>
</html>
